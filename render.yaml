services:
  - type: web
    name: kd-agent-api
    runtime: python
    plan: free
    buildCommand: python -m pip install .
    startCommand: python -m kd_agent.cli serve --host 0.0.0.0
    healthCheckPath: /api/v1/health
    envVars:
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: KD_AGENT_ALLOWED_ORIGINS
        value: "https://projectbykd-jpg.github.io,https://kd-agent-panel.onrender.com"
      - key: PYTHON_VERSION
        value: 3.13.0
