services:
  - type: web
    name: kd-agent-api
    runtime: python
    plan: free
    buildCommand: python -m pip install .
    startCommand: python -m kd_agent.cli serve --host 0.0.0.0
    healthCheckPath: /api/v1/health
    envVars:
      - key: AI_PROVIDER
        value: pateway
      - key: PATEWAY_API_KEY
        sync: false
      - key: PATEWAY_MODEL
        value: claude-sonnet-4-6
      - key: PATEWAY_MAX_TOKENS
        value: "4096"
      - key: KD_AGENT_ALLOWED_ORIGINS
        value: "https://projectbykd-jpg.github.io,https://kd-agent-panel.onrender.com"
      - key: PYTHON_VERSION
        value: 3.13.0
